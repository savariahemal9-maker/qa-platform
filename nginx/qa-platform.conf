##
## Nginx config for QA Platform
## File: /etc/nginx/sites-available/qa-platform
## Symlink: ln -s /etc/nginx/sites-available/qa-platform /etc/nginx/sites-enabled/
##
## PHP runs on PHP-FPM (unix socket)
## Node.js test engine runs on port 3001 (proxied at /engine/)
## WebSocket (wss://) proxied at /stream/
##

server {
    listen 80;
    listen [::]:80;
    server_name testingqa.hemalsavaria.com;

    # Redirect HTTP → HTTPS once SSL is set up
    # return 301 https://$host$request_uri;

    root /var/www/qa-platform/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # ── PHP files ────────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Pass env vars to PHP
        fastcgi_param DB_HOST      "127.0.0.1";
        fastcgi_param DB_NAME      "qa_platform";
        fastcgi_param DB_USER      "qa_user";
        fastcgi_param DB_PASS      "CHANGE_IN_PRODUCTION";
        fastcgi_param ENGINE_SECRET "CHANGE_IN_PRODUCTION";
        fastcgi_param APP_URL      "http://testingqa.hemalsavaria.com";
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── WebSocket stream (Playwright live screenshots) ─────────────────────
    # Browser connects to wss://testingqa.hemalsavaria.com/stream/<runId>
    # Nginx proxies it to ws://localhost:3001/stream/<runId>
    location /stream/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;   # keep WS open for up to 1 hour
        proxy_send_timeout 3600s;
    }

    # ── Engine HTTP REST (internal, optional public for health check) ─────────
    location /engine/ {
        # Restrict to server itself — not public
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── PHP router ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Block .env and config files ───────────────────────────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/qa-platform.access.log;
    error_log  /var/log/nginx/qa-platform.error.log;
}

